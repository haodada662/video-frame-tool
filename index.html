<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽帧台 · 视频抽帧工具</title>
<style>
  :root {
    --bg: #11141c;
    --bg-soft: #161a24;
    --panel: #1b2030;
    --line: #2a3040;
    --paper: #eef2f7;
    --paper-edge: #d8dee8;
    --ink: #161a24;
    --muted: #8a93a8;
    --muted-ink: #5a6272;
    --accent: #e8a33d;
    --accent-soft: rgba(232, 163, 61, 0.14);
    --good: #5bbf8f;
    --bad: #e06c6c;
    --sans: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Cascadia Code", "SFMono-Regular", "Consolas", "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #e9ecf3;
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px 96px; }

  /* ---------- header ---------- */
  .masthead { padding: 52px 0 8px; }
  .masthead .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
    color: var(--accent); text-transform: uppercase;
  }
  .masthead .kicker::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .masthead h1 {
    margin: 18px 0 10px;
    font-size: clamp(30px, 5vw, 46px);
    font-weight: 750; letter-spacing: -0.025em; line-height: 1.08;
  }
  .masthead .lede { margin: 0; max-width: 560px; color: var(--muted); font-size: 15px; }
  .masthead .lede strong { color: #e9ecf3; font-weight: 600; }

  /* ---------- controls ---------- */
  .controls {
    margin-top: 34px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .drop {
    position: relative; margin: 0; padding: 40px 28px; text-align: center;
    cursor: pointer; transition: background 0.16s ease;
  }
  .drop:hover, .drop.drag { background: var(--bg-soft); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop .icon {
    width: 46px; height: 46px; margin: 0 auto 14px;
    border: 1.5px dashed var(--muted); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 22px;
  }
  .drop .big { font-size: 16px; font-weight: 600; }
  .drop .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }

  .settings {
    display: flex; flex-wrap: wrap; gap: 18px 26px; align-items: flex-end;
    padding: 20px 28px; border-top: 1px solid var(--line); background: var(--bg-soft);
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.04em; }
  .field .val {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 12px; font-size: 14px;
  }
  .field .val input[type="number"] {
    width: 52px; background: transparent; border: 0; color: #e9ecf3;
    font: 600 14px/1 var(--mono); outline: none; -moz-appearance: textfield;
  }
  .field .val input[type="number"]::-webkit-outer-spin-button,
  .field .val input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 6px 13px; border-radius: 6px; font: 600 13px var(--sans);
  }
  .seg button.on { background: var(--accent); color: #241703; }
  .seg button:disabled { opacity: 0.35; cursor: not-allowed; }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row output { font-family: var(--mono); font-size: 13px; color: var(--accent); min-width: 30px; }
  input[type="range"] { width: 120px; accent-color: var(--accent); }

  .actions { margin-left: auto; display: flex; gap: 10px; align-items: flex-end; }
  button.primary, button.ghost {
    border: 0; cursor: pointer; border-radius: 10px; font: 600 14px var(--sans);
    padding: 11px 20px; transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
  }
  button.primary { background: var(--accent); color: #241703; }
  button.primary:hover { filter: brightness(1.06); }
  button.ghost { background: transparent; color: #e9ecf3; border: 1px solid var(--line); }
  button.ghost:hover { background: var(--panel); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .status {
    margin-top: 16px; font-family: var(--mono); font-size: 13px; color: var(--muted);
    min-height: 20px;
  }
  .status.error { color: var(--bad); }
  .status.done { color: var(--good); }

  /* ---------- light table ---------- */
  .lightbox { margin-top: 30px; }
  .lightbox:empty { display: none; }
  .film-top {
    height: 16px; margin: 0 6px; border-radius: 5px 5px 0 0;
    background:
      repeating-linear-gradient(90deg,
        transparent 0 9px, rgba(255,255,255,0.75) 9px 19px, transparent 19px 28px);
    background-color: #0c0f16;
    background-size: 28px 100%;
  }
  .film-top::after { content: ""; display: block; height: 100%; width: 100%; }
  .lightbox-inner {
    background: var(--paper); border: 1px solid var(--paper-edge);
    border-radius: 0 0 12px 12px; padding: 30px 26px 34px; color: var(--ink);
    min-height: 120px;
  }
  .empty-note { color: var(--muted-ink); font-size: 14px; text-align: center; padding: 40px 0; }

  .strip + .strip { margin-top: 34px; padding-top: 26px; border-top: 1px dashed var(--paper-edge); }
  .strip-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; margin-bottom: 16px; }
  .strip-head .name { font-weight: 700; font-size: 15px; word-break: break-all; }
  .strip-head .meta { font-family: var(--mono); font-size: 12px; color: var(--muted-ink); }
  .strip-head .zip-btn {
    margin-left: auto; border: 0; cursor: pointer; background: transparent;
    color: var(--ink); font: 600 12px var(--sans); text-decoration: underline;
    text-underline-offset: 3px; text-decoration-color: var(--muted-ink);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }

  .cell { background: #161a26; border-radius: 8px; padding: 10px 10px 9px; }
  .cell .perf {
    height: 10px; border-radius: 3px; margin-bottom: 8px;
    background: repeating-linear-gradient(90deg,
      #0c0f16 0 8px, #eef2f7 8px 16px, #0c0f16 16px 24px);
    background-size: 24px 100%;
  }
  .cell .frame { position: relative; background: #000; border-radius: 3px; overflow: hidden; }
  .cell img { display: block; width: 100%; height: auto; aspect-ratio: 16/10; object-fit: contain; background: #000; }
  .cell .cap {
    display: flex; align-items: center; gap: 8px; margin-top: 9px;
    font-family: var(--mono); font-size: 11px; color: #aeb6c8;
  }
  .cell .cap .tc { color: var(--accent); }
  .cell .cap a { margin-left: auto; color: #aeb6c8; text-decoration: none; }
  .cell .cap a:hover { color: #fff; }

  .field label.switch { font-family: var(--sans); letter-spacing: 0; color: inherit; }
  .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .switch .track { width: 38px; height: 21px; border-radius: 11px; background: var(--line); position: relative; transition: background 0.15s ease; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fff; transition: transform 0.15s ease; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(17px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch .switch-txt { font-size: 13px; color: #e9ecf3; }

  .cell .nine { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .cell .nine a { position: relative; display: block; aspect-ratio: 1/1; overflow: hidden; border-radius: 2px; background: #000; }
  .cell .nine a img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .cell .nine a:hover img { opacity: 0.8; }
  .cell .nine a .num {
    position: absolute; top: 2px; left: 2px; z-index: 1;
    font-family: var(--mono); font-size: 9px; line-height: 1; color: #fff;
    background: rgba(0, 0, 0, 0.62); padding: 2px 4px; border-radius: 3px;
  }

  body.cutout .cell .frame,
  body.cutout .cell .nine a {
    background-color: #1b2030;
    background-image:
      linear-gradient(45deg, #2a3040 25%, transparent 25%),
      linear-gradient(-45deg, #2a3040 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a3040 75%),
      linear-gradient(-45deg, transparent 75%, #2a3040 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
  }

  .foot {
    margin-top: 30px; color: var(--muted); font-size: 12px; text-align: center;
  }
  .foot code { font-family: var(--mono); color: #c3cad9; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px 72px; }
    .settings { flex-direction: column; align-items: stretch; }
    .actions { margin-left: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <span class="kicker">Frame Picker</span>
    <h1>抽帧台</h1>
    <p class="lede">把视频铺到光台上。<strong>首帧、尾帧</strong>，再加上按片长<strong>平均分布</strong>的中间帧，一次导出。</p>
  </header>

  <section class="controls" aria-label="抽帧设置">
    <label class="drop" id="drop">
      <span class="icon">＋</span>
      <span class="big">拖入视频，或点击选择</span>
      <span class="sub">支持同时添加多个文件 · MP4 / WebM / MOV 等浏览器可解码的格式</span>
      <input type="file" id="file" accept="video/*" multiple>
    </label>
    <div class="settings">
      <div class="field">
        <label>中间帧数量</label>
        <div class="val">
          <input type="number" id="midCount" value="5" min="0" max="99" step="1">
          <span id="midHint" style="color:var(--muted);font-size:12px">帧</span>
        </div>
      </div>
      <div class="field">
        <label>九宫格拆分</label>
        <label class="switch">
          <input type="checkbox" id="splitMode">
          <span class="track"></span>
          <span class="switch-txt">3×3 九等分</span>
        </label>
      </div>
      <div class="field">
        <label>自动抠图</label>
        <label class="switch">
          <input type="checkbox" id="cutoutMode">
          <span class="track"></span>
          <span class="switch-txt">主体分割 · 透明 PNG</span>
        </label>
      </div>
      <div class="field" id="cutoutQualityField" hidden>
        <label>抠图质量</label>
        <div class="seg" id="cutoutQualitySeg">
          <button type="button" data-model="small" title="量化模型，最快，细节一般">快速</button>
          <button type="button" data-model="medium" class="on" title="半精度模型，速度与质量均衡">标准</button>
          <button type="button" data-model="large" title="全精度模型，最精细，需下载约 170MB">精细</button>
        </div>
      </div>
      <div class="field">
        <label>导出格式</label>
        <div class="seg" id="formatSeg">
          <button type="button" data-fmt="image/png" class="on">PNG</button>
          <button type="button" data-fmt="image/jpeg">JPG</button>
        </div>
      </div>
      <div class="field" id="qualityField" hidden>
        <label>JPG 质量</label>
        <div class="range-row">
          <input type="range" id="quality" min="50" max="100" value="88" step="1">
          <output id="qualityOut">88</output>
        </div>
      </div>
      <div class="actions">
        <button class="ghost" id="clearBtn" type="button">清空</button>
        <button class="primary" id="runBtn" type="button" disabled>开始抽帧</button>
      </div>
    </div>
  </section>

  <p class="status" id="status" role="status"></p>

  <section class="lightbox" aria-label="抽帧结果">
    <div class="film-top" aria-hidden="true"></div>
    <div class="lightbox-inner" id="lightbox"></div>
  </section>

  <p class="foot">所有处理都在你的浏览器本地完成，视频不会上传。自动抠图基于本地分割模型，<strong>首次使用需联网下载模型（约几十 MB，仅一次，之后走缓存）</strong>。导出图片使用 <code>canvas.toBlob</code>，批量下载生成 ZIP。</p>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const fileInput = $("file");
const drop = $("drop");
const runBtn = $("runBtn");
const clearBtn = $("clearBtn");
const statusEl = $("status");
const lightbox = $("lightbox");
const midCount = $("midCount");
const midHint = $("midHint");
const quality = $("quality");
const qualityOut = $("qualityOut");
const qualityField = $("qualityField");
const formatSeg = $("formatSeg");
const splitToggle = $("splitMode");
const cutoutToggle = $("cutoutMode");
const cutoutQualityField = $("cutoutQualityField");
const cutoutQualitySeg = $("cutoutQualitySeg");

let files = [];
let format = "image/png";
let splitMode = false;
let cutoutMode = false;
let cutoutQuality = "medium";

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = "status" + (cls ? " " + cls : "");
}

function fmt(sec) {
  const ms = Math.max(0, Math.round(sec * 1000));
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  const mm = String(ms % 1000).padStart(3, "0");
  if (h > 0) {
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${mm}`;
  }
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${mm}`;
}

function baseName(name) {
  const i = name.lastIndexOf(".");
  const stem = i > 0 ? name.slice(0, i) : name;
  return stem.replace(/[\\/:*?"<>|]/g, "_").trim() || "video";
}

function ext() {
  return format === "image/jpeg" ? "jpg" : "png";
}

// ---------- capture ----------
function seekTo(video, time) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error("seek 超时"));
    }, 5000);
    function cleanup() {
      clearTimeout(timer);
      video.removeEventListener("seeked", onSeeked);
      video.removeEventListener("error", onError);
    }
    function onSeeked() {
      if (settled) return;
      settled = true;
      cleanup();
      resolve();
    }
    function onError() {
      if (settled) return;
      settled = true;
      cleanup();
      reject(new Error("视频读取失败"));
    }
    video.addEventListener("seeked", onSeeked, { once: true });
    video.addEventListener("error", onError, { once: true });
    video.currentTime = time;
  });
}

function waitForFrame(video) {
  return new Promise((resolve) => {
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      video.removeEventListener("loadeddata", finish);
      video.removeEventListener("canplay", finish);
      rafTwice(resolve);
    };
    const timer = setTimeout(finish, 2500);
    if (video.readyState >= 2) {
      finish();
      return;
    }
    video.addEventListener("loadeddata", finish);
    video.addEventListener("canplay", finish);
  });
}

function rafTwice(cb) {
  requestAnimationFrame(() => requestAnimationFrame(cb));
}

function drawToCanvas(video) {
  const w = video.videoWidth || 16;
  const h = video.videoHeight || 16;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, w, h);
  return canvas;
}

function canvasToBlob(canvas, fmtStr, q) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (blob) resolve(blob);
      else reject(new Error("画布导出失败"));
    }, fmtStr, q);
  });
}

function splitCanvas(canvas, fmtStr, q) {
  const W = canvas.width;
  const H = canvas.height;
  const jobs = [];
  for (let idx = 0; idx < 9; idx++) {
    const row = Math.floor(idx / 3);
    const col = idx % 3;
    const sx = Math.floor(W * col / 3);
    const sy = Math.floor(H * row / 3);
    const sw = Math.floor(W * (col + 1) / 3) - sx;
    const sh = Math.floor(H * (row + 1) / 3) - sy;
    const cell = document.createElement("canvas");
    cell.width = sw;
    cell.height = sh;
    cell.getContext("2d").drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    jobs.push(canvasToBlob(cell, fmtStr, q).then((blob) => ({ idx, blob })));
  }
  return Promise.all(jobs);
}

async function blobToCanvas(blob) {
  const bmp = await createImageBitmap(blob);
  const canvas = document.createElement("canvas");
  canvas.width = bmp.width;
  canvas.height = bmp.height;
  canvas.getContext("2d").drawImage(bmp, 0, 0);
  bmp.close();
  return canvas;
}

async function captureFrame(video, time) {
  const dur = video.duration;
  const target = Math.min(Math.max(0, time), Math.max(0, dur - 0.001));
  if (target === 0 && video.currentTime === 0 && video.readyState >= 2) {
    await waitForFrame(video);
    return drawToCanvas(video);
  }
  try {
    await seekTo(video, target);
  } catch (err) {
    if (target > 0.25) {
      await seekTo(video, target - 0.25);
    } else {
      throw err;
    }
  }
  await waitForFrame(video);
  return drawToCanvas(video);
}

let cutoutModulePromise = null;

async function loadCutoutModule() {
  if (!cutoutModulePromise) {
    cutoutModulePromise = import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm");
  }
  return cutoutModulePromise;
}

function erodeMin(a, w, h, radius) {
  const tmp = new Float32Array(a.length);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - radius);
      const x1 = Math.min(w - 1, x + radius);
      let m = 255;
      for (let xx = x0; xx <= x1; xx++) {
        const v = a[row + xx];
        if (v < m) m = v;
      }
      tmp[row + x] = m;
    }
  }
  const out = new Float32Array(a.length);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - radius);
      const y1 = Math.min(h - 1, y + radius);
      let m = 255;
      for (let yy = y0; yy <= y1; yy++) {
        const v = tmp[yy * w + x];
        if (v < m) m = v;
      }
      out[y * w + x] = m;
    }
  }
  return out;
}

function boxBlur1(a, w, h) {
  const tmp = new Float32Array(a.length);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let s = 0, c = 0;
      for (let xx = Math.max(0, x - 1); xx <= Math.min(w - 1, x + 1); xx++) {
        s += a[row + xx];
        c++;
      }
      tmp[row + x] = s / c;
    }
  }
  const out = new Float32Array(a.length);
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      let s = 0, c = 0;
      for (let yy = Math.max(0, y - 1); yy <= Math.min(h - 1, y + 1); yy++) {
        s += tmp[yy * w + x];
        c++;
      }
      out[y * w + x] = s / c;
    }
  }
  return out;
}

function defringe(imageData) {
  const w = imageData.width;
  const h = imageData.height;
  const data = imageData.data;
  const n = w * h;

  let br = 0, bg = 0, bb = 0, cnt = 0;
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    if (data[o + 3] < 8) {
      br += data[o];
      bg += data[o + 1];
      bb += data[o + 2];
      cnt++;
    }
  }
  const bgc = cnt > 0 ? [br / cnt, bg / cnt, bb / cnt] : [255, 255, 255];

  const alpha = new Float32Array(n);
  for (let i = 0; i < n; i++) alpha[i] = data[i * 4 + 3];
  const eroded = erodeMin(alpha, w, h, 2);
  for (let i = 0; i < n; i++) {
    const t = eroded[i] / 255;
    alpha[i] = 255 / (1 + Math.exp(-10 * (t - 0.5)));
  }
  const refined = boxBlur1(alpha, w, h);

  const out = new Uint8ClampedArray(data.length);
  for (let i = 0; i < n; i++) {
    const o = i * 4;
    const aOrig = data[o + 3];
    let a = refined[i];
    if (a < 8) a = 0;
    else if (a > 247) a = 255;
    if (a > 0 && a < 128) {
      const dist = Math.abs(data[o] - bgc[0]) + Math.abs(data[o + 1] - bgc[1]) + Math.abs(data[o + 2] - bgc[2]);
      if (dist < 40) a = 0;
    }
    if (a === 0) {
      out[o] = 0;
      out[o + 1] = 0;
      out[o + 2] = 0;
      out[o + 3] = 0;
      continue;
    }
    const af = aOrig / 255;
    for (let ch = 0; ch < 3; ch++) {
      let c = data[o + ch];
      if (af > 0.02 && af < 0.98) {
        c = (c - (1 - af) * bgc[ch]) / af;
      }
      out[o + ch] = c < 0 ? 0 : (c > 255 ? 255 : c);
    }
    out[o + 3] = a;
  }
  return new ImageData(out, w, h);
}

async function defringeBlob(blob) {
  const canvas = await blobToCanvas(blob);
  const ctx = canvas.getContext("2d");
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const out = document.createElement("canvas");
  out.width = canvas.width;
  out.height = canvas.height;
  out.getContext("2d").putImageData(defringe(imageData), 0, 0);
  return canvasToBlob(out, "image/png", undefined);
}

async function removeBackgroundModel(srcBlob, onProgress) {
  let mod;
  try {
    mod = await loadCutoutModule();
  } catch (err) {
    throw new Error("抠图模型加载失败，请检查网络连接");
  }
  const out = await mod.removeBackground(srcBlob, {
    model: cutoutQuality,
    progress: (key, current, total) => {
      if (key === "fetch:model") {
        onProgress(`下载模型 ${Math.round((current / total) * 100)}%`);
      } else if (key.startsWith("compute:")) {
        onProgress("主体分割计算中…");
      }
    }
  });
  onProgress("去除白边中…");
  return defringeBlob(out);
}

async function resolveDuration(video) {
  if (Number.isFinite(video.duration) && video.duration > 0) return video.duration;
  await seekTo(video, 1e9);
  if (Number.isFinite(video.duration) && video.duration > 0) return video.duration;
  throw new Error("无法读取视频时长");
}

// ---------- zip ----------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(entries) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  for (const entry of entries) {
    const nameBytes = enc.encode(entry.name);
    const crc = crc32(entry.data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(8, 0, true);
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, entry.data.length, true);
    local.setUint32(22, entry.data.length, true);
    local.setUint16(26, nameBytes.length, true);
    local.setUint16(28, 0, true);
    chunks.push(local.buffer, nameBytes, entry.data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, entry.data.length, true);
    cd.setUint32(24, entry.data.length, true);
    cd.setUint16(28, nameBytes.length, true);
    cd.setUint32(42, offset, true);
    central.push({ cd, nameBytes });
    offset += 30 + nameBytes.length + entry.data.length;
  }

  let centralSize = 0;
  for (const c of central) centralSize += 46 + c.nameBytes.length;
  const centralOffset = offset;
  for (const c of central) chunks.push(c.cd.buffer, c.nameBytes);

  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, central.length, true);
  end.setUint16(10, central.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, centralOffset, true);
  chunks.push(end.buffer);
  return new Blob(chunks, { type: "application/zip" });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ---------- results ----------
const results = []; // { name, duration, frames: [{label, time, blob, url, filename} | {label, time, pieces:[{n,blob,url,filename}]}] }

function render() {
  if (results.length === 0) {
    lightbox.innerHTML = '<p class="empty-note">还没有抽帧结果。先添加视频，再点「开始抽帧」。</p>';
    if (typeof zipAll !== "undefined") zipAll.disabled = true;
    return;
  }
  if (typeof zipAll !== "undefined") zipAll.disabled = false;
  const frag = document.createDocumentFragment();
  for (const r of results) {
    const strip = document.createElement("div");
    strip.className = "strip";
    const head = document.createElement("div");
    head.className = "strip-head";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = r.name;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = splitMode && r.frames[0] && r.frames[0].pieces
      ? `${fmt(r.duration)} · ${r.frames.length} 帧 × 9 格`
      : `${fmt(r.duration)} · ${r.frames.length} 帧`;
    const zipBtn = document.createElement("button");
    zipBtn.className = "zip-btn";
    zipBtn.textContent = splitMode && r.frames[0] && r.frames[0].pieces
      ? "下载该视频九宫格 ZIP"
      : "下载该视频 ZIP";
    zipBtn.addEventListener("click", () => downloadVideoZip(r));
    head.append(name, meta, zipBtn);

    const grid = document.createElement("div");
    grid.className = "grid";
    for (const f of r.frames) {
      grid.appendChild(cellEl(r, f));
    }
    strip.append(head, grid);
    frag.appendChild(strip);
  }
  lightbox.innerHTML = "";
  lightbox.appendChild(frag);
}

function cellEl(r, f) {
  const cell = document.createElement("div");
  cell.className = "cell";
  const perf = document.createElement("div");
  perf.className = "perf";
  const body = document.createElement("div");
  if (splitMode && f.pieces) {
    body.className = "nine";
    for (const p of f.pieces) {
      const a = document.createElement("a");
      a.href = p.url;
      a.download = p.filename;
      a.title = `${f.label} · 第${p.n}格 · 下载`;
      const img = document.createElement("img");
      img.src = p.url;
      img.alt = `${r.name} · ${f.label} · 第${p.n}格`;
      img.loading = "lazy";
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = p.n;
      a.append(img, num);
      body.appendChild(a);
    }
  } else {
    body.className = "frame";
    const img = document.createElement("img");
    img.src = f.url;
    img.alt = `${r.name} · ${f.label} · ${fmt(f.time)}`;
    img.loading = "lazy";
    body.appendChild(img);
  }
  const cap = document.createElement("div");
  cap.className = "cap";
  const label = document.createElement("span");
  label.textContent = f.label;
  const tc = document.createElement("span");
  tc.className = "tc";
  tc.textContent = fmt(f.time);
  cap.append(label, tc);
  if (!splitMode || !f.pieces) {
    const dl = document.createElement("a");
    dl.href = f.url;
    dl.download = f.filename;
    dl.textContent = "↓";
    dl.title = "下载单帧";
    cap.appendChild(dl);
  }
  cell.append(perf, body, cap);
  return cell;
}

async function downloadVideoZip(r) {
  const entries = [];
  if (splitMode && r.frames[0] && r.frames[0].pieces) {
    for (let g = 0; g < 9; g++) {
      for (const f of r.frames) {
        const p = f.pieces[g];
        entries.push({ name: `组${g + 1}/${p.filename}`, data: new Uint8Array(await p.blob.arrayBuffer()) });
      }
    }
    downloadBlob(buildZip(entries), `${baseName(r.name)}_九宫格.zip`);
  } else {
    for (const f of r.frames) {
      entries.push({ name: f.filename, data: new Uint8Array(await f.blob.arrayBuffer()) });
    }
    downloadBlob(buildZip(entries), `${baseName(r.name)}_抽帧.zip`);
  }
}

async function downloadAllZip() {
  if (results.length === 0 || results.every((r) => r.frames.length === 0)) {
    setStatus("还没有可导出的帧", "error");
    return;
  }
  const entries = [];
  if (splitMode && results[0].frames[0] && results[0].frames[0].pieces) {
    for (let g = 0; g < 9; g++) {
      for (const r of results) {
        for (const f of r.frames) {
          const p = f.pieces[g];
          entries.push({ name: `组${g + 1}/${p.filename}`, data: new Uint8Array(await p.blob.arrayBuffer()) });
        }
      }
    }
    downloadBlob(buildZip(entries), "抽帧_九宫格_9组.zip");
  } else {
    for (const r of results) {
      for (const f of r.frames) {
        entries.push({ name: `${baseName(r.name)}/${f.filename}`, data: new Uint8Array(await f.blob.arrayBuffer()) });
      }
    }
    downloadBlob(buildZip(entries), "抽帧_全部.zip");
  }
}

// ---------- run ----------
async function run() {
  runBtn.disabled = true;
  clearBtn.disabled = true;
  results.length = 0;
  render();
  const n = parseInt(midCount.value, 10);
  const mid = Number.isFinite(n) ? Math.max(0, Math.min(99, n)) : 5;
  const q = format === "image/jpeg" ? parseInt(quality.value, 10) / 100 : undefined;

  try {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      setStatus(`正在处理 ${i + 1}/${files.length} · ${file.name}`, "");
      const r = await extractVideo(file, mid, q, splitMode);
      results.push(r);
      render();
    }
    const frameCount = results.reduce((a, r) => a + r.frames.length, 0);
    const cutoutNote = cutoutMode ? " · 已抠图（透明 PNG）" : "";
    setStatus(splitMode
      ? `完成 · 共 ${files.length} 个视频，${frameCount} 帧 × 9 格 = ${frameCount * 9} 张小图${cutoutNote}`
      : `完成 · 共 ${files.length} 个视频，${frameCount} 帧${cutoutNote}`, "done");
  } catch (err) {
    setStatus(`出错了：${err.message}`, "error");
  } finally {
    runBtn.disabled = files.length === 0;
    clearBtn.disabled = files.length === 0;
  }
}

async function extractVideo(file, mid, q, split) {
  const url = URL.createObjectURL(file);
  const video = document.createElement("video");
  video.muted = true;
  video.playsInline = true;
  video.preload = "auto";
  video.src = url;

  try {
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = resolve;
      video.onerror = () => reject(new Error("无法解码该视频格式"));
    });
    const duration = await resolveDuration(video);

    const times = [];
    const labels = [];
    times.push(0);
    labels.push("首帧");
    for (let k = 1; k <= mid; k++) {
      times.push(duration * (k / (mid + 1)));
      labels.push(`中${String(k).padStart(2, "0")}`);
    }
    times.push(duration);
    labels.push("尾帧");

    const frames = [];
    for (let k = 0; k < times.length; k++) {
      setStatus(`正在处理 ${file.name} · ${k + 1}/${times.length} 帧`, "");
      const canvas = await captureFrame(video, times[k]);
      const label = labels[k];
      const time = Math.min(times[k], Math.max(0, duration - 0.001));

      let splitSource = canvas;
      let flatBlob = null;
      if (cutoutMode) {
        const srcBlob = await canvasToBlob(canvas, "image/png", undefined);
        const cutBlob = await removeBackgroundModel(srcBlob, (msg) =>
          setStatus(`${file.name} · ${label}：${msg}`, "")
        );
        if (split) {
          splitSource = await blobToCanvas(cutBlob);
        } else {
          flatBlob = cutBlob;
        }
      }

      if (split) {
        const parts = await splitCanvas(splitSource, cutoutMode ? "image/png" : format, q);
        const pieces = parts.sort((a, b) => a.idx - b.idx).map((p) => ({
          n: p.idx + 1,
          blob: p.blob,
          url: URL.createObjectURL(p.blob),
          filename: `${baseName(file.name)}_${label}_格${p.idx + 1}.${cutoutMode ? "png" : ext()}`
        }));
        frames.push({ label, time, pieces });
      } else {
        const blob = flatBlob || await canvasToBlob(splitSource, cutoutMode ? "image/png" : format, q);
        frames.push({
          label,
          time,
          blob,
          url: URL.createObjectURL(blob),
          filename: `${baseName(file.name)}_${label}.${cutoutMode ? "png" : ext()}`
        });
      }
    }
    return { name: file.name, duration, frames };
  } finally {
    URL.revokeObjectURL(url);
  }
}

// ---------- events ----------
function addFiles(list) {
  const added = Array.from(list).filter((f) => f.type.startsWith("video/") || /\.(mp4|webm|mov|m4v|mkv|avi|ogv)$/i.test(f.name));
  if (added.length === 0) {
    setStatus("没有识别到视频文件", "error");
    return;
  }
  files = files.concat(added);
  runBtn.disabled = files.length === 0;
  clearBtn.disabled = files.length === 0;
  setStatus(`已添加 ${files.length} 个视频，点击「开始抽帧」`, "");
}

fileInput.addEventListener("change", () => {
  addFiles(fileInput.files);
  fileInput.value = "";
});

["dragenter", "dragover"].forEach((ev) =>
  drop.addEventListener(ev, (e) => {
    e.preventDefault();
    drop.classList.add("drag");
  })
);
["dragleave", "drop"].forEach((ev) =>
  drop.addEventListener(ev, (e) => {
    e.preventDefault();
    drop.classList.remove("drag");
  })
);
drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

runBtn.addEventListener("click", run);

function revokeFrame(f) {
  if (f.pieces) {
    for (const p of f.pieces) URL.revokeObjectURL(p.url);
  } else if (f.url) {
    URL.revokeObjectURL(f.url);
  }
}

function clearResults() {
  for (const r of results) for (const f of r.frames) revokeFrame(f);
  results.length = 0;
}

clearBtn.addEventListener("click", () => {
  clearResults();
  files = [];
  runBtn.disabled = true;
  clearBtn.disabled = true;
  render();
  setStatus("", "");
});

splitToggle.addEventListener("change", () => {
  splitMode = splitToggle.checked;
  clearResults();
  render();
  syncZipLabel();
  setStatus(splitMode ? "九宫格拆分已开启，点击「开始抽帧」重新抽取" : "九宫格拆分已关闭，点击「开始抽帧」重新抽取", "");
});

cutoutToggle.addEventListener("change", () => {
  cutoutMode = cutoutToggle.checked;
  document.body.classList.toggle("cutout", cutoutMode);
  cutoutQualityField.hidden = !cutoutMode;
  if (cutoutMode) format = "image/png";
  syncFormatButtons();
  clearResults();
  render();
  setStatus(cutoutMode ? "自动抠图已开启，输出透明 PNG（首次使用需联网下载模型）" : "自动抠图已关闭，点击「开始抽帧」重新抽取", "");
});

cutoutQualitySeg.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-model]");
  if (!btn) return;
  cutoutQuality = btn.dataset.model;
  cutoutQualitySeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === btn));
  setStatus(`抠图质量已设为「${btn.textContent}」，点击「开始抽帧」重新抽取`, "");
});

function syncFormatButtons() {
  formatSeg.querySelectorAll("button").forEach((b) => {
    const isPng = b.dataset.fmt === "image/png";
    b.classList.toggle("on", b.dataset.fmt === format);
    b.disabled = cutoutMode && !isPng;
  });
  qualityField.hidden = format !== "image/jpeg";
}

formatSeg.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-fmt]");
  if (!btn) return;
  if (btn.disabled) return;
  format = btn.dataset.fmt;
  syncFormatButtons();
});

quality.addEventListener("input", () => (qualityOut.textContent = quality.value));

midCount.addEventListener("input", () => {
  const n = parseInt(midCount.value, 10);
  midHint.textContent = Number.isFinite(n) && n >= 0 ? (n === 0 ? "只抽首尾帧" : `帧 · 首尾共 ${n + 2} 帧`) : "帧";
});

// global zip via a small floating action
const zipAll = document.createElement("button");
zipAll.className = "ghost";
zipAll.type = "button";
zipAll.style.cssText = "margin-left:10px;";
zipAll.disabled = true;
zipAll.addEventListener("click", downloadAllZip);
runBtn.insertAdjacentElement("afterend", zipAll);

function syncZipLabel() {
  zipAll.textContent = splitMode ? "打包九宫格大组 ZIP" : "全部打包 ZIP";
}
syncZipLabel();
</script>
</body>
